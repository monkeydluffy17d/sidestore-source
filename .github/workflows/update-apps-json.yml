name: Update SideStore Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"  # Daily at Midnight IST (6:30 PM UTC)
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Fetch YTKACE latest release
      # ============================================================
      - name: Get YTKACE release info
        id: ytkace
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: "itzzace",
                repo: "ytkace"
              });
              
              const asset = release.data.assets.find(a => a.name.toLowerCase().includes(".ipa"));
              if (!asset) throw new Error("No IPA asset found in YTKACE release");

              // Extract YouTube base version from IPA filename (e.g., YouTube_21.33.6.ipa)
              const youtubeVersion = asset.name.match(/YouTube_(\d+\.\d+\.\d+)/)?.[1];
              if (!youtubeVersion) throw new Error("Could not parse YouTube version from asset name");

              core.setOutput("youtubeVersion", youtubeVersion);
              core.setOutput("tweakVersion", release.data.tag_name);
              core.setOutput("date", release.data.published_at);
              core.setOutput("notes", release.data.body || "No release notes provided");
              core.setOutput("downloadURL", asset.browser_download_url);
              core.setOutput("size", asset.size);
              
              console.log(`✅ YTKACE: v${youtubeVersion} (${asset.size} bytes)`);
            } catch (error) {
              core.setFailed(`YTKACE fetch failed: ${error.message}`);
              throw error;
            }

      # ============================================================
      # Fetch EeveeSpotify from SideloadLabs AltSource
      # ============================================================
      - name: Get EeveeSpotify release info
        id: eeveespotify
        run: |
          set -e
          
          echo "Fetching EeveeSpotify from SideloadLabs source..."
          
          # Fetch from SideloadLabs AltSource
          RESPONSE=$(curl -sf "https://raw.githubusercontent.com/SideloadLabs/SideloasLabs-AltSource/refs/heads/main/apps.json" 2>&1)
          
          if [ -z "$RESPONSE" ]; then
            echo "❌ Failed to fetch SideloadLabs source"
            exit 1
          fi
          
          # Extract the FIRST EeveeSpotify app (unpatched version) - compact JSON output
          EEVEE_APP=$(echo "$RESPONSE" | jq -c '.apps[] | select(.name == "EeveeSpotifyReincarnated" and .bundleIdentifier == "com.spotify.client")' 2>/dev/null | head -1)
          
          if [ -z "$EEVEE_APP" ] || [ "$EEVEE_APP" == "null" ]; then
            echo "⚠️  EeveeSpotifyReincarnated (unpatched) not found in source"
            echo "eevee_app={}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Store the entire app object as JSON
          echo "eevee_app=$EEVEE_APP" >> $GITHUB_OUTPUT
          
          # Extract individual fields for display
          VERSION=$(echo "$EEVEE_APP" | jq -r '.version // "unknown"')
          echo "✅ EeveeSpotify v$VERSION found"

      # ============================================================
      # Generate apps.json by merging sources
      # ============================================================
      - name: Update apps.json
        run: |
          set -e
          
          # Format YTKACE date
          YDATE_FMT=$(date -d "${{ steps.ytkace.outputs.date }}" +%Y-%m-%d 2>/dev/null || echo "2025-01-01")
          
          # Get the scraped EeveeSpotify app (entire object as JSON)
          EEVEE_APP='${{ steps.eeveespotify.outputs.eevee_app }}'
          
          # Build apps array starting with YTKACE
          APPS=$(jq -n \
            --arg yname "YTKACE" \
            --arg ybid "com.google.ios.youtube" \
            --arg ydev "itzzace" \
            --arg yver "${{ steps.ytkace.outputs.youtubeVersion }}" \
            --arg ydate "$YDATE_FMT" \
            --arg yurl "${{ steps.ytkace.outputs.downloadURL }}" \
            --arg ydesc "An enhanced YouTube client featuring background playback, ad-blocking, and custom overlay options.\n\n✨ Full Changelog & Release History:\nhttps://github.com/itzzace/ytkace/releases" \
            --arg yverdesc "${{ steps.ytkace.outputs.notes }}" \
            --arg ysub "Videos, Music and Live Streams" \
            --arg yicon "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/d4/21/29/d4212929-8101-bde8-3b87-06455bed3cb7/Placeholder.mill/400x400bb-75.webp" \
            --arg ytint "FF0000" \
            --arg ysize "${{ steps.ytkace.outputs.size }}" \
            '[
              {
                "name": $yname,
                "bundleIdentifier": $ybid,
                "developerName": $ydev,
                "version": $yver,
                "versionDate": $ydate,
                "downloadURL": $yurl,
                "localizedDescription": $ydesc,
                "versionDescription": $yverdesc,
                "subtitle": $ysub,
                "iconURL": $yicon,
                "tintColor": $ytint,
                "screenshots": [
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/20/e0/9a/20e09afc-ad0c-bfbe-954b-d5b8d40c5401/91963c43-9224-4e3f-ae6c-ba3ac6de40cd_iOS-6.5-in_1.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/1b/47/80/1b4780c9-4cfd-1295-30c7-cbac2ee9f5d3/30797521-a83b-484b-ba8c-9e70626e258a_iOS-6.5-in_2.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/c2/59/61/c25961a1-a767-cceb-0665-202d8e68d685/5646e7c2-990f-4233-8839-27edda3105e4_iOS-6.5-in_3.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/7d/80/e8/7d80e8b3-6ec8-3634-d6d6-2cbc290363dc/7500778b-8579-41fa-a538-11cce073604b_iOS-6.5-in_4.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/cb/3f/4b/cb3f4bb7-69aa-b669-95e0-953b800bd208/6dbb548a-365f-4c7d-a56c-f41b7be9642c_iOS-6.5-in_5.jpg/460x996bb.webp"
                ],
                "size": ($ysize | tonumber)
              }
            ]')
          
          # Add EeveeSpotify if fetch was successful
          if [ "$EEVEE_APP" != "{}" ] && [ ! -z "$EEVEE_APP" ]; then
            echo "✅ Adding scraped EeveeSpotify from SideloadLabs source..."
            # The scraped app already has correct bundleIdentifier and screenshots from SideloadLabs
            APPS=$(echo "$APPS" | jq --argjson eevee "$EEVEE_APP" '. += [$eevee]')
          else
            echo "⚠️  EeveeSpotify not available, using only YTKACE"
          fi
          
          # Create final source JSON
          jq -n \
            --arg name "Luffy's App Store" \
            --arg identifier "com.monkeydluffy17d.source" \
            --arg subtitle "Curated tweaks & sideloaded apps, updated daily" \
            --arg description "My personal SideStore repo packed with the latest builds of my go-to apps." \
            --arg iconURL "https://raw.githubusercontent.com/monkeydluffy17d/sidestore-source/refs/heads/main/Images/luffyavatar.png" \
            --arg sourceURL "https://raw.githubusercontent.com/monkeydluffy17d/sidestore-source/refs/heads/main/apps.json" \
            --argjson apps "$APPS" \
            '{
              "name": $name,
              "identifier": $identifier,
              "subtitle": $subtitle,
              "description": $description,
              "iconURL": $iconURL,
              "sourceURL": $sourceURL,
              "apps": $apps
            }' > apps.json
          
          echo "✅ apps.json generated successfully"

      # ============================================================
      # Validate the generated JSON
      # ============================================================
      - name: Validate apps.json
        run: |
          set -e
          
          echo "Validating JSON structure..."
          jq empty apps.json || {
            echo "❌ Invalid JSON generated!"
            exit 1
          }
          
          echo "Checking required fields..."
          jq -e '.name and .apps' apps.json || {
            echo "❌ Missing name or apps field"
            exit 1
          }
          
          echo "Validating all apps have required fields..."
          jq -e '.apps[] | select(.bundleIdentifier and .version and .downloadURL)' apps.json > /dev/null || {
            echo "❌ Some apps missing required fields"
            jq '.apps[]' apps.json
            exit 1
          }
          
          echo "✅ JSON validation passed"
          echo ""
          echo "📦 Generated Source:"
          jq -r '.name' apps.json
          jq -r '.apps[] | "\(.name) v\(.version)"' apps.json

      # ============================================================
      # Commit and push changes
      # ============================================================
      - name: Commit and push updates
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet apps.json; then
            echo "ℹ️  No changes to commit"
          else
            echo "📝 Committing updated apps.json..."
            git add apps.json
            git commit -m "chore: update apps.json [skip ci]"
            git push origin main
            echo "✅ Changes pushed"
          fi
