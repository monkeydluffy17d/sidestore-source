name: Update SideStore Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"  # 6:30 PM UTC = Midnight IST
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Fetch YTKACE release info
      # ============================================================
      - name: Get YTKACE release info
        id: ytkace
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: "itzzace",
                repo: "ytkace"
              });
              
              const asset = release.data.assets.find(a => a.name.toLowerCase().includes(".ipa"));
              if (!asset) throw new Error("No IPA asset found in YTKACE release");

              // Extract YouTube base version from IPA filename (e.g., YouTube_21.33.6.ipa)
              const youtubeVersion = asset.name.match(/YouTube_(\d+\.\d+\.\d+)/)?.[1];
              if (!youtubeVersion) throw new Error("Could not parse YouTube version from asset name");

              core.setOutput("youtubeVersion", youtubeVersion);
              core.setOutput("tweakVersion", release.data.tag_name);
              core.setOutput("date", release.data.published_at);
              core.setOutput("notes", release.data.body || "No release notes provided");
              core.setOutput("downloadURL", asset.browser_download_url);
              core.setOutput("size", asset.size);
              
              console.log(`✅ YTKACE: v${youtubeVersion} (${asset.size} bytes)`);
            } catch (error) {
              core.setFailed(`YTKACE fetch failed: ${error.message}`);
              throw error;
            }

      # ============================================================
      # Fetch EeveeSpotify info (FIXED!)
      # ============================================================
      - name: Get EeveeSpotify release info
        id: eeveespotify
        run: |
          set -e
          
          echo "Fetching EeveeSpotify data..."
          
          # Fetch from Eevee-Alt-Source (correct repository)
          RESPONSE=$(curl -sf "https://github.com/SideloadLabs/Eevee-Alt-Source/raw/refs/heads/main/apps.json" 2>&1)
          
          if [ -z "$RESPONSE" ]; then
            echo "⚠️  EeveeSpotify JSON not found, trying fallback..."
            # Fallback: if repo structure is different, you might need to adjust this
            RESPONSE='{}'
          fi
          
          # Extract each field carefully with fallbacks
          VERSION=$(echo "$RESPONSE" | jq -r '.apps[0].version // empty' 2>/dev/null || echo "")
          DATE=$(echo "$RESPONSE" | jq -r '.apps[0].versionDate // empty' 2>/dev/null || echo "")
          DOWNLOADURL=$(echo "$RESPONSE" | jq -r '.apps[0].downloadURL // empty' 2>/dev/null || echo "")
          NOTES=$(echo "$RESPONSE" | jq -r '.apps[0].versionDescription // .apps[0].localizedDescription // empty' 2>/dev/null || echo "")
          SIZE=$(echo "$RESPONSE" | jq -r '.apps[0].size // 0' 2>/dev/null || echo "0")
          
          # Output in GitHub Actions format
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "downloadURL=$DOWNLOADURL" >> $GITHUB_OUTPUT
          echo "notes=$NOTES" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          
          # Show what we got
          echo "✅ EeveeSpotify v$VERSION"

      # ============================================================
      # Generate apps.json with proper error handling
      # ============================================================
      - name: Update apps.json
        run: |
          set -e
          
          # Format dates properly
          YDATE_FMT=$(date -d "${{ steps.ytkace.outputs.date }}" +%Y-%m-%d 2>/dev/null || echo "2025-01-01")
          
          # Check if EeveeSpotify data is available
          EEVEEVER="${{ steps.eeveespotify.outputs.version }}"
          EEVEEURL="${{ steps.eeveespotify.outputs.downloadURL }}"
          EEVEENOTES="${{ steps.eeveespotify.outputs.notes }}"
          EEVEESIZE="${{ steps.eeveespotify.outputs.size }}"
          EVERDATE_FMT="${{ steps.eeveespotify.outputs.date }}"
          
          # Build the apps array - start with YTKACE (always available)
          APPS_JSON=$(jq -n \
            --arg yname "YTKACE" \
            --arg ybid "com.itzzace.ytkace" \
            --arg ydev "itzzace" \
            --arg yver "${{ steps.ytkace.outputs.youtubeVersion }}" \
            --arg ydate "$YDATE_FMT" \
            --arg yurl "${{ steps.ytkace.outputs.downloadURL }}" \
            --arg ydesc "An enhanced YouTube client featuring background playback, ad-blocking, and custom overlay options.\n\n✨ Full Changelog & Release History:\nhttps://github.com/itzzace/ytkace/releases" \
            --arg yverdesc "${{ steps.ytkace.outputs.notes }}" \
            --arg ysub "Videos, Music and Live Streams" \
            --arg yicon "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/d4/21/29/d4212929-8101-bde8-3b87-06455bed3cb7/Placeholder.mill/400x400bb-75.webp" \
            --arg ytint "FF0000" \
            --arg ysize "${{ steps.ytkace.outputs.size }}" \
            '[
              {
                "name": $yname,
                "bundleIdentifier": $ybid,
                "developerName": $ydev,
                "version": $yver,
                "versionDate": $ydate,
                "downloadURL": $yurl,
                "localizedDescription": $ydesc,
                "versionDescription": $yverdesc,
                "subtitle": $ysub,
                "iconURL": $yicon,
                "tintColor": $ytint,
                "screenshots": [
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/20/e0/9a/20e09afc-ad0c-bfbe-954b-d5b8d40c5401/91963c43-9224-4e3f-ae6c-ba3ac6de40cd_iOS-6.5-in_1.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/1b/47/80/1b4780c9-4cfd-1295-30c7-cbac2ee9f5d3/30797521-a83b-484b-ba8c-9e70626e258a_iOS-6.5-in_2.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/c2/59/61/c25961a1-a767-cceb-0665-202d8e68d685/5646e7c2-990f-4233-8839-27edda3105e4_iOS-6.5-in_3.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/7d/80/e8/7d80e8b3-6ec8-3634-d6d6-2cbc290363dc/7500778b-8579-41fa-a538-11cce073604b_iOS-6.5-in_4.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/cb/3f/4b/cb3f4bb7-69aa-b669-95e0-953b800bd208/6dbb548a-365f-4c7d-a56c-f41b7be9642c_iOS-6.5-in_5.jpg/460x996bb.webp"
                ],
                "size": ($ysize | tonumber)
              }
            ]')
          
          # Add EeveeSpotify only if we have valid data
          if [ ! -z "$EEVEEVER" ] && [ ! -z "$EEVEEURL" ]; then
            echo "✅ Adding EeveeSpotify to apps..."
            # Extract date from ISO format (remove time part)
            EVERDATE_CLEAN=$(echo "$EVERDATE_FMT" | cut -d'T' -f1)
            
            APPS_JSON=$(echo "$APPS_JSON" | jq \
              --arg ename "EeveeSpotifyReincarnated" \
              --arg ebid "com.spotify.client" \
              --arg edev "SideloadLabs" \
              --arg ever "$EEVEEVER" \
              --arg edate "$EVERDATE_CLEAN" \
              --arg eurl "$EEVEEURL" \
              --arg edesc "Enjoy an upgraded, premium-like Spotify experience with ad-blocking and native tweak integration.\n\n✨ Full Changelog & Release History:\nhttps://github.com/SideloadLabs/EeveeSpotifyReincarnated/releases" \
              --arg everdesc "$EEVEENOTES" \
              --arg esub "Songs, Playlists & Audiobooks" \
              --arg eicon "https://files.catbox.moe/9fgova.JPG" \
              --arg etint "1DB954" \
              --arg esize "$EEVEESIZE" \
              '. += [
                {
                  "name": $ename,
                  "bundleIdentifier": $ebid,
                  "developerName": $edev,
                  "version": $ever,
                  "versionDate": $edate,
                  "downloadURL": $eurl,
                  "localizedDescription": $edesc,
                  "versionDescription": $everdesc,
                  "subtitle": $esub,
                  "iconURL": $eicon,
                  "tintColor": $etint,
                  "screenshots": [
                    "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/32/8d/97/328d97d5-1f15-64bb-cd07-9c99caa3df21/IOS_-_6.5_-_S01_-_EN_-_GB.png/300x650bb.webp",
                    "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/78/a7/41/78a74106-c5ed-407f-016a-0e5ec1828022/IOS_-_6.5_-_S02_-_EN_-_GB.png/300x650bb.webp",
                    "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/03/b0/10/03b010df-e0f0-a98c-38dd-3fe51a4faa15/IOS_-_6.5_-_S03_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp",
                    "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/5b/f9/f0/5bf9f0c5-fae8-6c74-98a3-47112d9a3fb8/IOS_-_6.5_-_S04_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp",
                    "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/13/db/cc/13dbcc4c-dfde-edd3-1489-368afd232f47/IOS_-_6.5_-_S05_-_EN_-_GB.png/300x650bb.webp",
                    "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/60/70/3c/60703c64-cd84-ffc2-c1ac-f7bf951ab2f8/IOS_-_6.5_-_S06_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp",
                    "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/18/88/4a/18884ac2-b1da-30ad-af09-560b2f7fea2c/IOS_-_6.5_-_S07_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp",
                    "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/8e/a4/3c/8ea43c40-6400-dbb2-8305-d9958986ef67/IOS_-_6.5_-_S08_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp"
                  ],
                  "size": ($esize | tonumber)
                }
              ]')
          else
            echo "⚠️  EeveeSpotify data not available, skipping for this run..."
          fi
          
          # Create the final JSON with metadata
          jq -n \
            --arg name "Luffy's App Store" \
            --arg identifier "com.monkeydluffy17d.source" \
            --arg subtitle "Curated tweaks & sideloaded apps, updated daily" \
            --arg description "My personal SideStore repo packed with the latest builds of my go-to apps." \
            --arg iconURL "https://raw.githubusercontent.com/monkeydluffy17d/sidestore-source/refs/heads/main/Images/luffyavatar.png" \
            --arg sourceURL "https://raw.githubusercontent.com/monkeydluffy17d/sidestore-source/refs/heads/main/apps.json" \
            --argjson apps "$APPS_JSON" \
            '{
              "name": $name,
              "identifier": $identifier,
              "subtitle": $subtitle,
              "description": $description,
              "iconURL": $iconURL,
              "sourceURL": $sourceURL,
              "apps": $apps
            }' > apps.json
          
          echo "✅ apps.json generated successfully"

      # ============================================================
      # Validate the generated JSON
      # ============================================================
      - name: Validate apps.json
        run: |
          set -e
          
          echo "Validating JSON structure..."
          jq empty apps.json || {
            echo "❌ Invalid JSON generated!"
            exit 1
          }
          
          echo "Checking required fields..."
          jq -e '.name and .apps' apps.json || {
            echo "❌ Missing name or apps field"
            exit 1
          }
          
          echo "Validating all apps have required fields..."
          jq -e '.apps[] | select(.bundleIdentifier and .version and .downloadURL)' apps.json > /dev/null || {
            echo "❌ Some apps missing required fields"
            jq '.apps[]' apps.json
            exit 1
          }
          
          echo "✅ JSON validation passed"
          echo ""
          echo "📦 Generated Source:"
          jq '.name, .apps[] | .name, .version' apps.json

      # ============================================================
      # Commit and push changes
      # ============================================================
      - name: Commit and push updates
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet apps.json; then
            echo "ℹ️  No changes to commit"
          else
            echo "📝 Committing updated apps.json..."
            git add apps.json
            git commit -m "chore: update apps.json [skip ci]" -m "- YTKACE: ${{ steps.ytkace.outputs.youtubeVersion }}\n- EeveeSpotify: ${{ steps.eeveespotify.outputs.version }}\n\nTriggered by: ${{ github.event_name }}"
            git push origin main
            echo "✅ Changes pushed"
          fi
