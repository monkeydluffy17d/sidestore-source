name: Update SideStore Repo

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Fetch YTKACE release info
      - name: Get YTKACE release info
        id: ytkace
        uses: actions/github-script@v6
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: "itzzace",
              repo: "ytkace"
            });
            const asset = release.assets.find(a => a.name.endsWith(".ipa"));
            if (!asset) throw new Error("No IPA asset found in YTKACE release");
            return {
              version: release.tag_name,
              notes: release.body || "No release notes provided",
              downloadURL: asset.browser_download_url,
              size: asset.size
            };

      # Fetch EverSpotify release info
      - name: Get EverSpotify release info
        id: everspotify
        uses: actions/github-script@v6
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: "<otheruser>",   # replace with actual GitHub username
              repo: "everspotify"    # replace with actual repo name
            });
            const asset = release.assets.find(a => a.name.endsWith(".ipa"));
            if (!asset) throw new Error("No IPA asset found in EverSpotify release");
            return {
              version: release.tag_name,
              notes: release.body || "No release notes provided",
              downloadURL: asset.browser_download_url,
              size: asset.size
            };

      # Write apps.json
      - name: Update apps.json
        run: |
          echo '{
            "apps": [
              {
                "name": "YTKACE",
                "bundleIdentifier": "com.itzzace.ytkace",
                "developerName": "itzzace",
                "version": "${{ steps.ytkace.outputs.version }}",
                "downloadURL": "${{ steps.ytkace.outputs.downloadURL }}",
                "localizedDescription": "${{ steps.ytkace.outputs.notes }}",
                "iconURL": "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/d4/21/29/d4212929-8101-bde8-3b87-06455bed3cb7/Placeholder.mill/400x400bb-75.webp",
                "tintColor": "FF0000",
                "screenshots": [
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/36/db/ec/36dbecd1-9a85-d55a-e84b-8022ea777825/7a94f703-7c3e-4789-9bd7-ce80045fe7b6_iOS-6.5-in_1.jpg/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/41/55/e3/4155e384-a42d-6062-2007-282bb040363d/9bde600a-9d57-41c4-830b-3261fee4a323_iOS-6.5-in_2.jpg/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/c0/16/8b/c0168b1e-2e37-25bb-8336-b896eabd3374/634cb861-844f-4310-9dca-1d395031a99e_iOS-6.5-in_3.jpg/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/cd/e7/a1/cde7a135-8317-6194-d251-2bc40d54b8bf/8d366307-dd64-45f4-8cf3-d45be7dec00d_iOS-6.5-in_4.jpg/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/c6/c1/f4/c6c1f493-99c1-37e6-7b34-fdceef94b082/84bdc830-e257-413c-b355-024445f557e5_iOS-6.5-in_5.jpg/230x498bb.webp"
                ],
                "size": ${{ steps.ytkace.outputs.size }}
              },
              {
                "name": "EverSpotify",
                "bundleIdentifier": "com.everspotify.app",
                "developerName": "EverSpotify Dev",
                "version": "${{ steps.everspotify.outputs.version }}",
                "downloadURL": "${{ steps.everspotify.outputs.downloadURL }}",
                "localizedDescription": "${{ steps.everspotify.outputs.notes }}",
                "iconURL": "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/09/8b/bc/098bbc51-3b38-2566-90a1-dcd361b8c646/Placeholder.mill/400x400bb-75.webp",
                "tintColor": "1DB954",
                "screenshots": [
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/28/58/0d/28580d62-47f7-d6ce-aa73-69e3dbe21642/IOS_-_6.5_-_S01_-_EN_-_US.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/13/fb/21/13fb2184-8c5c-190c-86af-582bb5430446/IOS_-_6.5_-_S02_-_EN_-_US.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/63/5d/d5/635dd568-ba3b-a0a1-2916-52497dec2ad6/IOS_-_6.5_-__U005bEnglish__U0028US_U0029_U005d.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/5b/07/b2/5b07b2d7-b990-cf1c-1154-350d877c00a0/IOS_-_6.5_-_S03_-_EN_-_US.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/a2/3e/94/a23e94b6-1401-de71-817e-5a33b4d821a9/IOS_-_6.5_-_S04_-_EN_-_US.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/fd/9a/47/fd9a47d4-029b-eb3b-2a39-a6de9b515aae/IOS_-_6.5_-_S05_-_EN_-_US.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/ed/01/1a/ed011a26-bdbe-0c99-160b-2a79eadb857d/IOS_-_6.5_-_S06_-_EN_-_US.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/e8/ad/72/e8ad72c3-9abc-f028-485f-22d787ab03e4/IOS_-_6.5_-_S07_-_EN_-_US.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/0d/d1/a4/0dd1a46a-3e03-e522-7ec4-a8e6c3cc84da/IOS_-_6.5_-_S08_-_EN_-_US.png/230x498bb.webp"
                ],
                "size": ${{ steps.everspotify.outputs.size }}
              }
            ]
          }' > apps.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apps.json
          git commit -m "Update apps.json with latest releases"
          git push
