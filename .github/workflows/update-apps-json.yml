name: Update SideStore Repo

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Fetch YTKACE release info
      - name: Get YTKACE release info
        id: ytkace
        uses: actions/github-script@v6
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: "itzzace",
              repo: "ytkace"
            });
            const asset = release.data.assets.find(a => a.name.endsWith(".ipa"));
            if (!asset) throw new Error("No IPA asset found in YTKACE release");
            core.setOutput("version", release.data.tag_name);
            core.setOutput("notes", release.data.body || "No release notes provided");
            core.setOutput("downloadURL", asset.browser_download_url);
            core.setOutput("size", asset.size);

      # Fetch EverSpotify release info
      - name: Get EverSpotify release info
        id: everspotify
        uses: actions/github-script@v6
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: "SideloadLabs",
              repo: "EeveeSpotifyReincarnated"
            });
            const asset = release.data.assets.find(a => a.name.endsWith(".ipa"));
            if (!asset) throw new Error("No IPA asset found in EverSpotify release");
            core.setOutput("version", release.data.tag_name);
            core.setOutput("notes", release.data.body || "No release notes provided");
            core.setOutput("downloadURL", asset.browser_download_url);
            core.setOutput("size", asset.size);

      # Write apps.json
      - name: Update apps.json
        run: |
          echo '{
            "apps": [
              {
                "name": "YTKACE",
                "bundleIdentifier": "com.itzzace.ytkace",
                "developerName": "itzzace",
                "version": "${{ steps.ytkace.outputs.version }}",
                "downloadURL": "${{ steps.ytkace.outputs.downloadURL }}",
                "localizedDescription": "${{ steps.ytkace.outputs.notes }}",
                "iconURL": "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/d4/21/29/d4212929-8101-bde8-3b87-06455bed3cb7/Placeholder.mill/400x400bb-75.webp",
                "tintColor": "FF0000",
                "screenshots": [
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/36/db/ec/36dbecd1-9a85-d55a-e84b-8022ea777825/7a94f703-7c3e-4789-9bd7-ce80045fe7b6_iOS-6.5-in_1.jpg/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/41/55/e3/4155e384-a42d-6062-2007-282bb040363d/9bde600a-9d57-41c4-830b-3261fee4a323_iOS-6.5-in_2.jpg/230x498bb.webp"
                ],
                "size": ${{ steps.ytkace.outputs.size }}
              },
              {
                "name": "EverSpotify",
                "bundleIdentifier": "com.everspotify.app",
                "developerName": "EverSpotify Dev",
                "version": "${{ steps.everspotify.outputs.version }}",
                "downloadURL": "${{ steps.everspotify.outputs.downloadURL }}",
                "localizedDescription": "${{ steps.everspotify.outputs.notes }}",
                "iconURL": "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/09/8b/bc/098bbc51-3b38-2566-90a1-dcd361b8c646/Placeholder.mill/400x400bb-75.webp",
                "tintColor": "1DB954",
                "screenshots": [
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/28/58/0d/28580d62-47f7-d6ce-aa73-69e3dbe21642/IOS_-_6.5_-_S01_-_EN_-_US.png/230x498bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/13/fb/21/13fb2184-8c5c-190c-86af-582bb5430446/IOS_-_6.5_-_S02_-_EN_-_US.png/230x498bb.webp"
                ],
                "size": ${{ steps.everspotify.outputs.size }}
              }
            ]
          }' > apps.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apps.json
          git commit -m "Update apps.json with latest releases"
          git push
