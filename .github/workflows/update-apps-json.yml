name: Update SideStore Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"  # Daily at Midnight IST (6:30 PM UTC)
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Fetch YTKACE latest release
      # ============================================================
      - name: Get YTKACE release info
        id: ytkace
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: "itzzace",
                repo: "ytkace"
              });

              const ipaAssets = release.data.assets.filter(a => a.name.toLowerCase().endsWith(".ipa"));
              if (ipaAssets.length === 0) throw new Error("No IPA assets found in YTKACE release");

              const assetsWithVersions = ipaAssets.map(asset => {
                const youtubeVersion = asset.name.match(/YouTube_(\d+\.\d+\.\d+)/)?.[1];
                return { asset, youtubeVersion };
              }).filter(a => a.youtubeVersion);

              if (assetsWithVersions.length === 0) throw new Error("Could not parse YouTube version from any IPA");

              assetsWithVersions.sort((a, b) => {
                const aParts = a.youtubeVersion.split('.').map(Number);
                const bParts = b.youtubeVersion.split('.').map(Number);
                for (let i = 0; i < 3; i++) {
                  if (aParts[i] !== bParts[i]) return bParts[i] - aParts[i];
                }
                return 0;
              });

              const selectedAsset = assetsWithVersions[0];
              const youtubeVersion = selectedAsset.youtubeVersion;
              const asset = selectedAsset.asset;

              core.setOutput("youtubeVersion", youtubeVersion);
              core.setOutput("tweakVersion", release.data.tag_name);
              core.setOutput("date", release.data.published_at);
              core.setOutput("notes", release.data.body || "No release notes provided");
              core.setOutput("downloadURL", asset.browser_download_url);
              core.setOutput("size", asset.size);
              core.setOutput("filename", asset.name);

              console.log(`✅ YTKACE: v${youtubeVersion} (YouTube ${youtubeVersion})`);
            } catch (error) {
              core.setFailed(`YTKACE fetch failed: ${error.message}`);
              throw error;
            }

      # ============================================================
      # Download and strip YTKACE IPA
      # ============================================================
      - name: Download and strip YTKACE IPA
        id: strip_ipa
        run: |
          set -e

          echo "📥 Downloading YTKACE IPA..."
          curl -fL -o ytkace_original.ipa "${{ steps.ytkace.outputs.downloadURL }}"

          echo "📦 Extracting IPA..."
          mkdir -p ipa_extracted
          unzip -q ytkace_original.ipa -d ipa_extracted

          echo "🔍 Finding and removing .appex bundles..."
          APPEX_COUNT=$(find ipa_extracted -name "*.appex" -type d | wc -l)
          find ipa_extracted -name "*.appex" -type d | while read appex; do
            echo "  ❌ Removing: $(basename $appex)"
            rm -rf "$appex"
          done

          echo "Removed $APPEX_COUNT .appex bundles"

          # Verify no .appex files remain
          if find ipa_extracted -name "*.appex" -type d | grep -q .; then
            echo "❌ Error: Some .appex bundles still exist!"
            exit 1
          fi

          echo "✅ All .appex bundles removed"

          echo "📦 Repackaging stripped IPA..."
          cd ipa_extracted
          zip -r -q ../ytkace_stripped.ipa .
          cd ..

          # Get new file size
          STRIPPED_SIZE=$(stat -c%s ytkace_stripped.ipa 2>/dev/null || stat -f%z ytkace_stripped.ipa 2>/dev/null)
          echo "✅ Stripped IPA: $STRIPPED_SIZE bytes"
          echo "stripped_size=$STRIPPED_SIZE" >> $GITHUB_OUTPUT

      # ============================================================
      # Upload stripped IPA to GitHub Release
      # ============================================================
      - name: Create/Update GitHub Release with stripped IPA
        uses: softprops/action-gh-release@v1
        with:
          files: ytkace_stripped.ipa
          tag_name: stripped-${{ steps.ytkace.outputs.tweakVersion }}
          name: "YTKACE ${{ steps.ytkace.outputs.tweakVersion }} (Extensions Stripped)"
          body: |
            YTKACE v${{ steps.ytkace.outputs.tweakVersion }} with embedded extensions removed

            **YouTube Base Version:** ${{ steps.ytkace.outputs.youtubeVersion }}
            **Original IPA:** ${{ steps.ytkace.outputs.filename }}
            **Stripped IPA Size:** ${{ steps.strip_ipa.outputs.stripped_size }} bytes

            **What's Different:**
            - All .appex (extension) bundles removed
            - Reduces App ID consumption from ~9 IDs to just 1 ID
            - Compatible with free Apple Developer accounts

            **Original Release:** https://github.com/itzzace/ytkace/releases/tag/${{ steps.ytkace.outputs.tweakVersion }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Fetch EeveeSpotify from SideloadLabs AltSource
      # ============================================================
      - name: Get EeveeSpotify release info
        id: eeveespotify
        run: |
          set -e

          echo "Fetching EeveeSpotify from SideloadLabs source..."

          RESPONSE=$(curl -sf "https://raw.githubusercontent.com/SideloadLabs/SideloasLabs-AltSource/refs/heads/main/apps.json" 2>&1)

          if [ -z "$RESPONSE" ]; then
            echo "❌ Failed to fetch SideloadLabs source"
            exit 1
          fi

          EEVEE_APP=$(echo "$RESPONSE" | jq -c '.apps[] | select(.name == "EeveeSpotifyReincarnated" and .bundleIdentifier == "com.spotify.client")' 2>/dev/null | head -1)

          if [ -z "$EEVEE_APP" ] || [ "$EEVEE_APP" == "null" ]; then
            echo "⚠️  EeveeSpotifyReincarnated not found"
            echo "eevee_app={}" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "eevee_app=$EEVEE_APP" >> $GITHUB_OUTPUT
          VERSION=$(echo "$EEVEE_APP" | jq -r '.version // "unknown"')
          echo "✅ EeveeSpotify v$VERSION found"

      # ============================================================
      # Generate apps.json
      # ============================================================
      - name: Update apps.json
        run: |
          set -e

          YDATE_FMT=$(date -d "${{ steps.ytkace.outputs.date }}" +%Y-%m-%d 2>/dev/null || echo "2025-01-01")
          EEVEE_APP='${{ steps.eeveespotify.outputs.eevee_app }}'

          # Escape the release notes for jq
          NOTES_JSON=$(printf '%s\n' "${{ steps.ytkace.outputs.notes }}" | jq -Rs .)

          # Construct stripped IPA download URL from release
          STRIPPED_IPA_URL="https://github.com/${{ github.repository }}/releases/download/stripped-${{ steps.ytkace.outputs.tweakVersion }}/ytkace_stripped.ipa"

          # Build YTKACE entry with stripped IPA
          APPS=$(jq -n \
            --arg yname "YTKACE" \
            --arg ybid "com.google.ios.youtube" \
            --arg ydev "itzzace" \
            --arg yver "${{ steps.ytkace.outputs.youtubeVersion }}" \
            --arg ydate "$YDATE_FMT" \
            --arg yurl "$STRIPPED_IPA_URL" \
            --arg ydesc "An enhanced YouTube client featuring background playback, ad-blocking, and custom overlay options.\n\n**Note:** This version has embedded extensions removed to save App IDs on free accounts.\n\n✨ Full Changelog & Release History:\nhttps://github.com/itzzace/ytkace/releases" \
            --arg ysub "Videos, Music and Live Streams" \
            --arg yicon "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/d4/21/29/d4212929-8101-bde8-3b87-06455bed3cb7/Placeholder.mill/400x400bb-75.webp" \
            --arg ytint "FF0000" \
            --arg ysize "${{ steps.strip_ipa.outputs.stripped_size }}" \
            --argjson yverdesc "$NOTES_JSON" \
            '[
              {
                "name": $yname,
                "bundleIdentifier": $ybid,
                "developerName": $ydev,
                "version": $yver,
                "versionDate": $ydate,
                "downloadURL": $yurl,
                "localizedDescription": $ydesc,
                "versionDescription": $yverdesc,
                "subtitle": $ysub,
                "iconURL": $yicon,
                "tintColor": $ytint,
                "screenshots": [
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/20/e0/9a/20e09afc-ad0c-bfbe-954b-d5b8d40c5401/91963c43-9224-4e3f-ae6c-ba3ac6de40cd_iOS-6.5-in_1.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/1b/47/80/1b4780c9-4cfd-1295-30c7-cbac2ee9f5d3/30797521-a83b-484b-ba8c-9e70626e258a_iOS-6.5-in_2.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/c2/59/61/c25961a1-a767-cceb-0665-202d8e68d685/5646e7c2-990f-4233-8839-27edda3105e4_iOS-6.5-in_3.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/7d/80/e8/7d80e8b3-6ec8-3634-d6d6-2cbc290363dc/7500778b-8579-41fa-a538-11cce073604b_iOS-6.5-in_4.jpg/460x996bb.webp",
                  "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/cb/3f/4b/cb3f4bb7-69aa-b669-95e0-953b800bd208/6dbb548a-365f-4c7d-a56c-f41b7be9642c_iOS-6.5-in_5.jpg/460x996bb.webp"
                ],
                "size": ($ysize | tonumber)
              }
            ]')

          # Add EeveeSpotify if available
          if [ "$EEVEE_APP" != "{}" ] && [ ! -z "$EEVEE_APP" ]; then
            echo "✅ Adding EeveeSpotify..."
            APPS=$(echo "$APPS" | jq --argjson eevee "$EEVEE_APP" '. += [$eevee |
              .subtitle = "Songs, Playlists & Audiobooks" |
              .localizedDescription = (.localizedDescription + "\n\n✨ Full Changelog & Release History:\nhttps://github.com/SideloadLabs/EeveeSpotifyReincarnated/releases") |
              .excludedBundleIdentifiers = [
                "com.spotify.client.NotificationContentExtension",
                "com.spotify.client.NotificationServiceExtension",
                "com.spotify.client.IntentsExtension",
                "com.spotify.client.WidgetKitExtension"
              ] |
              .screenshots = [
                "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/32/8d/97/328d97d5-1f15-64bb-cd07-9c99caa3df21/IOS_-_6.5_-_S01_-_EN_-_GB.png/300x650bb.webp",
                "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/78/a7/41/78a74106-c5ed-407f-016a-0e5ec1828022/IOS_-_6.5_-_S02_-_EN_-_GB.png/300x650bb.webp",
                "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/03/b0/10/03b010df-e0f0-a98c-38dd-3fe51a4faa15/IOS_-_6.5_-_S03_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp",
                "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/5b/f9/f0/5bf9f0c5-fae8-6c74-98a3-47112d9a3fb8/IOS_-_6.5_-_S04_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp",
                "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/13/db/cc/13dbcc4c-dfde-edd3-1489-368afd232f47/IOS_-_6.5_-_S05_-_EN_-_GB.png/300x650bb.webp",
                "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/60/70/3c/60703c64-cd84-ffc2-c1ac-f7bf951ab2f8/IOS_-_6.5_-_S06_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp",
                "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/18/88/4a/18884ac2-b1da-30ad-af09-560b2f7fea2c/IOS_-_6.5_-_S07_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp",
                "https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/8e/a4/3c/8ea43c40-6400-dbb2-8305-d9958986ef67/IOS_-_6.5_-_S08_-__U005bEnglish__U0028GB_U0029_U005d.png/300x650bb.webp"
              ]
            ]')
          fi

          # Create final JSON
          jq -n \
            --arg name "Luffy's App Store" \
            --arg identifier "com.monkeydluffy17d.source" \
            --arg subtitle "Curated tweaks & sideloaded apps, updated daily" \
            --arg description "My personal SideStore repo packed with the latest builds of my go-to apps. YTKACE extensions stripped to save App IDs." \
            --arg iconURL "https://raw.githubusercontent.com/monkeydluffy17d/sidestore-source/refs/heads/main/Images/luffyavatar.png" \
            --arg sourceURL "https://raw.githubusercontent.com/monkeydluffy17d/sidestore-source/refs/heads/main/apps.json" \
            --argjson apps "$APPS" \
            '{
              "name": $name,
              "identifier": $identifier,
              "subtitle": $subtitle,
              "description": $description,
              "iconURL": $iconURL,
              "sourceURL": $sourceURL,
              "apps": $apps
            }' > apps.json

          echo "✅ apps.json generated successfully"

      # ============================================================
      # Validate JSON
      # ============================================================
      - name: Validate apps.json
        run: |
          set -e
          echo "Validating JSON structure..."
          jq empty apps.json
          jq -e '.name and .apps' apps.json > /dev/null
          echo "✅ JSON validation passed"
          echo ""
          echo "📦 Generated Source:"
          jq -r '.name' apps.json
          jq -r '.apps[] | "  \(.name) v\(.version)"' apps.json

      # ============================================================
      # Commit and push
      # ============================================================
      - name: Commit and push updates
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet apps.json; then
            echo "ℹ️  No changes to commit"
          else
            echo "📝 Committing updated apps.json..."
            git add apps.json
            git commit -m "chore: update apps.json with stripped YTKACE IPA [skip ci]"
            git push origin main
            echo "✅ Changes pushed"
          fi
